output_dir: pwa/public
# Specify the list of directories to be included into the final
# app.wasm file.
# public/ is deliberately not packed: it holds deployed PWA artifacts
# (including app.wasm itself — packing it recursed the bundle to 179MB),
# and the in-VM app serves no static files the demo needs.
pack_directories:
  - app
  - lib
  - config
  - db

# Specify the list of gems to skip during the base module compiliation.
# Usually, you want to specify the gems with native extensions that are
# not currently Wasm-compatible.
exclude_gems:
  - bigdecimal # remove on Ruby 3.4+
  - nio4r
  - io-console
  - psych
  - date
  - json
  - prism      # breaks parsing Ruby blocks/procs
  - nokogiri
  - racc
  - openssl

# Skip building native extensions for the following gems (and keep their Ruby source)
ignore_gem_extensions:
 - websocket-driver
