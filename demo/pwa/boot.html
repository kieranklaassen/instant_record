<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="og:title" content="Rails on Wasm" />
    <meta name="og:description" content="Rails on Wasm launcher" />
    <title>Rails on Wasm | Launch</title>
    <script type="module" src="/boot.js"></script>
    <!-- The launcher loads before Rails exists, so it carries its own styles.
         Same Swiss foundation as the app: black on white, one red accent,
         Helvetica, hard rules, figures in tabular mono. -->
    <style>
      :root {
        --ink: #111111;
        --paper: #ffffff;
        --hairline: #d9d9d9;
        --red: #e30613;
        --muted: #6b6b6b;
        --font: "Helvetica Neue", Helvetica, Arial, sans-serif;
        --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: var(--font);
        line-height: 1.4;
        color: var(--ink);
        background: var(--paper);
        -webkit-font-smoothing: antialiased;
      }

      main { max-width: 46rem; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }

      .micro-label {
        margin: 0;
        font-size: 0.7rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: var(--red);
      }

      h1 {
        margin: 0.25rem 0 0;
        font-size: 2rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.05;
      }

      p { max-width: 34rem; font-size: 0.9rem; }

      #buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin: 1.5rem 0;
      }

      button {
        font-family: var(--font);
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        padding: 0.55rem 0.9rem;
        border: 2px solid var(--ink);
        border-radius: 0;
        background: var(--ink);
        color: var(--paper);
        cursor: pointer;
      }

      button.secondary { background: var(--paper); color: var(--ink); }
      button:hover:not(:disabled) { background: var(--red); border-color: var(--red); color: var(--paper); }
      button:disabled { background: var(--paper); border-color: var(--hairline); color: var(--muted); cursor: default; }

      #boot-message {
        font-family: var(--mono);
        font-size: 0.8rem;
        color: var(--muted);
      }

      progress { width: 100%; height: 0.5rem; margin: 0.5rem 0 1.5rem; }

      /* Boot ledger: what the worker measured, phase by phase. Only a build
         with the instrumentation writes here, which is also how you tell
         whether the worker you edited is the one the browser is running. */
      #boot-ledger {
        margin: 0;
        padding: 0.75rem 0;
        border-top: 2px solid var(--ink);
        border-bottom: 2px solid var(--ink);
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
        font-size: 0.75rem;
        white-space: pre-wrap;
        min-height: 3rem;
      }

      #boot-console-output {
        margin: 1.5rem 0 0;
        padding: 0.75rem;
        border: 1px solid var(--hairline);
        font-family: var(--mono);
        font-size: 0.7rem;
        color: var(--muted);
        white-space: pre-wrap;
        min-height: 8rem;
        max-height: 20rem;
        overflow-y: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="micro-label">InstantRecord</p>
      <h1>Launcher</h1>
      <p>
        A development launcher for the browser runtime. Wait for the service
        worker to install and boot the app, then hit Launch. The ledger below is
        measured by the worker as it boots — the visitor-facing version of it is
        the splash at <code>/</code>.
      </p>

      <p id="buttons">
        <button id="launch-button" disabled>Launch</button>
        <button id="reload-button" class="secondary" disabled>Reload Rails</button>
        <button id="reload-debug-button" class="secondary" disabled>
          Reload Rails (debug)
        </button>
        <button id="reboot-button" class="secondary" disabled>Cold boot (wipe local data)</button>
      </p>

      <div id="boot-message"></div>
      <progress id="boot-progress" max="100" value="0"></progress>

      <p class="micro-label">Boot ledger</p>
      <pre id="boot-ledger">waiting for the worker…</pre>

      <pre id="boot-console-output"></pre>
    </main>
  </body>
</html>
