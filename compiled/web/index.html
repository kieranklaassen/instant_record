<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>InstantRecord — compiled</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="icon" href="data:,">
    <script>
      // Start compiling the app from the first line of the shell. The worker that will run it
      // starts from the end of this head in a built shell; the compiled module is handed to it.
      window.__wasmStart = performance.now();
      window.__wasm = WebAssembly.compileStreaming(fetch("%VITE_WASM_URL%", { priority: "high", cache: location.search.includes("instant_record_cold_boot=1") ? "reload" : "default" })).then(
        function (module) { window.__wasmMs = performance.now() - window.__wasmStart; return module; },
        function () { return null; });
    </script>
  </head>
  <body>
    <p id="instant-record-loading" role="status">Loading…</p>
    <style>
      #instant-record-loading { font: 16px/1.5 system-ui, sans-serif; color: GrayText; text-align: center; margin: 30vh 16px 0; animation: instant-record-loading 0s .4s both; }
      @keyframes instant-record-loading { from { visibility: hidden; } to { visibility: visible; } }
    </style>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
