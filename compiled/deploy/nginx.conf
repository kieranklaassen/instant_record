server {
  listen 80;
  root /site;

  gzip_static on;
  gzip_proxied any;
  gzip_vary on;

  # Kamal's health check.
  location = /up {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Named after their content: safe to keep forever.
  location ~ ^/(app-[\w.-]+\.wasm|harness/.+)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Only the ruby.wasm build's service worker asks for this file, every time it starts.
  # On a host that used to serve that build, a plain "not here" stops that worker from
  # starting its app; rails.sw.js then replaces it and reloads the tab.
  location = /app.wasm {
    add_header Cache-Control "no-store" always;
    return 404;
  }

  # The demo's own assets.
  location /assets/ {
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  # Every other path is a page of the app: serve the shell, which boots the compiled module.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
